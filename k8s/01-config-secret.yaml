apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: va-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "password"
  MYSQL_DATABASE: "salesdb"
  MYSQL_USER: "va_user"
  MYSQL_PASSWORD: "va_password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: va-system
data:
  DB_URL: "mysql+pymysql://root:password@mysql-service:3306/salesdb"
  CACHE_SECONDS: "30"
  PORT: "5000"
